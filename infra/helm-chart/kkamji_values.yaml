global:
  imageRegistry: harbor.kkamji.net
  imagePullSecrets:
    - name: harbor-credentials
fullnameOverride: image-converter
backend:
  image:
    repository: image-converter/backend
    tag: "backend-20250927-ec001a"
    pullPolicy: Always
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 33%
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    - name: PYTHONPATH
      value: "/app"
    - name: TMPDIR
      value: "/tmp"
    - name: VIPS_TMPDIR
      value: "/tmp"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits: null
  tmpfs:
    enabled: true
    medium: Memory
    sizeLimit: 1Gi
    initImage: busybox:1.36
  healthcheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
frontend:
  image:
    repository: image-converter/frontend
    tag: "frontend-20250927-ec001a"
    pullPolicy: Always
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 33%
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits: null
  env:
    - name: REACT_APP_API_URL
      value: "/api"
    - name: REACT_APP_BACKEND_ENDPOINT
      value: "http://image-converter-backend:8000"
    - name: BACKEND_ENDPOINT
      value: "http://image-converter-backend:8000"
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: 121.130.214.237
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
  hosts:
    - host: image-converter.kkamji.net
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: image-converter-tls
      hosts:
        - image-converter.kkamji.net
autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 180
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 180
        selectPolicy: Min
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 180
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 180
        selectPolicy: Min
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
podDisruptionBudget:
  enabled: true
  minAvailable: 1
nodeSelector: {}
tolerations: []
affinity: {}
