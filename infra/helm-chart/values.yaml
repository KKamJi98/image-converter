global:
  imageRegistry: harbor.example.com
  imagePullSecrets: []
fullnameOverride: image-converter

backend:
  image:
    repository: image-converter/backend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 33%

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  env:
    - name: PYTHONPATH
      value: "/app"

  # Optional tmpfs mount for /tmp to enable O_TMPFILE and speed up temp I/O
  tmpfs:
    enabled: false
    # medium: Memory   # Memory=tmpfs, unset for node disk (ext4/xfs)
    # sizeLimit: 1Gi
    # initImage: busybox:1.36        # /tmp 권한 초기화용 이미지
    # initImagePullPolicy: IfNotPresent

  healthcheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

frontend:
  image:
    repository: image-converter/frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  replicaCount: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 33%

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    - name: REACT_APP_API_URL
      value: "/api"
    - name: REACT_APP_BACKEND_ENDPOINT
      value: "http://image-converter-backend:8000"
    - name: BACKEND_ENDPOINT
      value: "http://image-converter-backend:8000"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: image-converter.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: image-converter-tls
      hosts:
        - image-converter.example.com

autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior: {}
    #   scaleUp:
    #     stabilizationWindowSeconds: 180
    #     selectPolicy: Max
    #     policies:
    #       - type: Percent
    #         value: 100
    #         periodSeconds: 60
    #       - type: Pods
    #         value: 2
    #         periodSeconds: 60
    #   scaleDown:
    #     stabilizationWindowSeconds: 180
    #     selectPolicy: Max
    #     policies:
    #       - type: Percent
    #         value: 50
    #         periodSeconds: 60

  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    behavior: {}
    #   scaleUp:
    #     stabilizationWindowSeconds: 180
    #     policies:
    #       - type: Percent
    #         value: 100
    #         periodSeconds: 60
    #   scaleDown:
    #     stabilizationWindowSeconds: 180
    #     policies:
    #       - type: Percent
    #         value: 50
    #         periodSeconds: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
